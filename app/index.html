<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanFrame</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/typefaces.css">
<link rel="stylesheet" href="assets/private-fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
      <main class="stage" id="stage" tabindex="0" aria-label="Menú de TV, 1920 por 1080. Haz clic y usa las flechas, Enter para aceptar y Escape para volver.">
        <div class="scene" id="scene">
        <div class="bg" id="bg" aria-hidden="true">
          <img class="photo" id="photo" alt="">
          <div class="scrim"></div>
          <div class="shade"></div>
          <div class="ph-dim"></div>
          <div class="ph-scrim"></div>
          <div class="ph-col"></div>
          <div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
        </div>

        <div class="home" id="home">
          <div class="header-material" id="headerClockSurface" aria-hidden="true"><img class="header-material-img" id="headerClockImg" alt=""><div class="header-material-veil"></div></div>
          <div class="header-material" id="headerMenuSurface" aria-hidden="true"><img class="header-material-img" id="headerMenuImg" alt=""><div class="header-material-veil"></div></div>
          <div class="caption" id="caption"></div>
          <nav class="utils" id="utils" aria-label="Controles de Inicio"></nav>
          <div class="util-focus-label" id="utilFocusLabel" aria-hidden="true"></div>
          <div class="app-focus-name" id="appFocusName" aria-hidden="true"></div>
          <div class="ph-plate ut-lens" id="utLens" aria-hidden="true">
            <div class="ph-field" id="utField">
              <img class="ph-field-img" id="utFieldImg" alt="">
              <div class="scrim"></div><div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
            </div><div class="ph-veil"></div>
          </div>
          <div class="ph-plate ut-lens" id="utLensAlt" aria-hidden="true">
            <div class="ph-field" id="utFieldAlt">
              <img class="ph-field-img" id="utFieldImgAlt" alt="">
              <div class="scrim"></div><div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
            </div><div class="ph-veil"></div>
          </div>

          <div class="dock" id="dock">
            <div class="mat" aria-hidden="true"><img class="mat-img" id="matImg" alt=""><div class="mat-scrim" id="matScrim"></div><div class="mat-veil"></div></div>
            <div class="shelf" id="shelf"><div class="track" id="track"><div class="plate" id="plate"></div></div></div>
            <div class="dock-empty" id="dockEmpty"></div>
          </div>
          <div class="cue" id="cueL" aria-hidden="true"></div>
          <div class="cue" id="cueR" aria-hidden="true"></div>
          <div class="dock-action" id="dockAction" role="button"></div>

          <div class="ph-scene" id="phScene">
            <div class="ph-plate" id="phPlate" aria-hidden="true">
              <div class="ph-field" id="phField">
                <img class="ph-field-img" id="phFieldImg" alt="">
                <div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
              </div>
              <div class="ph-veil"></div>
            </div>
            <div class="ph-plate" id="phPlateAlt" aria-hidden="true">
              <div class="ph-field" id="phFieldAlt">
                <img class="ph-field-img" id="phFieldImgAlt" alt="">
                <div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
              </div>
              <div class="ph-veil"></div>
            </div>
            <div class="ph-list" id="phList"><div class="ph-rows" id="phRows"></div></div>
            <div class="ph-action" id="phAction" role="button"></div>
            <div class="ph-empty" id="phEmpty"></div>
          </div>

        </div>

        </div>
        <section class="appearance" id="appearance" hidden role="dialog" aria-labelledby="appearanceTitle">
          <div class="settings-back" id="appearanceBack"></div>
          <h2 class="settings-title" id="appearanceTitle"></h2>
          <div class="appearance-rows" id="appearanceRows"></div>
          <p class="appearance-desc" id="appearanceDesc"></p>
          <div class="settings-status" id="appearanceStatus" aria-live="polite"></div>
        </section>
        <div class="sheet" id="sheet" hidden>
          <img class="sheet-bg" id="sheetBg" alt="" aria-hidden="true">
          <div class="sheet-veil" aria-hidden="true"></div>
          <div class="view" id="sheetView" role="dialog" aria-modal="true"></div>
        </div>
        <nav id="panelNav" class="panel-nav" aria-label="Navegación del menú" hidden></nav>
        <div class="focus-status" id="focusStatus" aria-live="polite"></div>
      </main>
<section id="liveTVDialog" class="owner-dialog live-tv-dialog" role="dialog" aria-modal="true" aria-labelledby="liveTVTitle" hidden>
  <div class="live-tv-card">
    <button id="liveTVClose" class="live-tv-back" type="button">‹ Volver a Inicio</button>
    <h2 id="liveTVTitle">TV en directo</h2>
    <button id="liveTVGuide" class="live-tv-guide-button" type="button">Guía de programación</button>
    <aside class="live-tv-sidebar" aria-label="Canales de televisión">
      <div class="live-tv-list-heading"><h3>Canales</h3><span id="liveTVCount"></span></div>
      <div id="liveTVChannels" class="live-tv-channels" aria-label="Lista desplazable de canales"></div>
      <p id="liveTVListStatus" class="live-tv-list-status" role="status">Cargando canales…</p>
      <button id="liveTVRetry" class="live-tv-retry" type="button">Reintentar lista</button>
    </aside>
    <div class="live-tv-viewer">
      <div id="liveTVFrame" class="live-tv-frame"></div>
      <div class="live-tv-footer"><p id="liveTVStatus" role="status">Preparando la emisión…</p>
        <button id="liveTVFullscreen" type="button">Ver a pantalla completa</button></div>
      <section class="live-tv-program" aria-label="Información del programa">
        <div class="live-tv-program-heading"><h3 id="liveTVProgramTitle">Consultando programación…</h3><span id="liveTVProgramTime"></span></div>
        <div id="liveTVProgress" class="live-tv-progress" hidden><span></span></div>
        <div id="liveTVDescription" class="live-tv-description" tabindex="0" role="region" aria-label="Descripción del programa, usa arriba y abajo para leer"></div>
        <p id="liveTVNext" class="live-tv-next"></p>
      </section>
    </div>
    <p class="live-tv-hint">↑ ↓ Vista previa <span>OK Ver a pantalla completa</span><span>Volver Cerrar</span></p>
  </div>
  <section id="programmeGuide" class="programme-guide" aria-label="Guía de programación" hidden>
    <nav class="guide-nav"><button id="guideBack" type="button">‹ Volver a TV en directo</button><button id="guideEarlier" type="button">‹ Anterior</button><button id="guideNow" type="button">Ahora</button><button id="guideLater" type="button">Siguiente ›</button></nav>
    <h2>Guía de programación</h2><p id="guideDate" class="guide-date"></p>
    <div id="guideHours" class="guide-hours"></div><div id="guideRows" class="guide-rows"></div>
    <div class="guide-pages"><button id="guideUp" type="button">↑ Canales anteriores</button><span id="guidePage"></span><button id="guideDown" type="button">↓ Más canales</button></div>
    <section class="guide-details"><div class="guide-detail-heading"><h3 id="guideTitle">Selecciona un programa</h3><span id="guideTime"></span><button id="guideWatch" type="button">Ver canal</button></div><div id="guideDescription" tabindex="0" role="region" aria-label="Descripción del programa"></div></section>
    <p class="guide-hint">← → Programas y horas · ↑ ↓ Canales · OK Consultar · Ver canal para sintonizar</p>
  </section>
</section>
<script src="assets/source-names.js"></script>
<script src="device.js"></script>
<script src="programme-guide.js"></script>
<script src="assets/icons/metrics.js"></script>
<script src="assets/wallpapers/catalog.js"></script>
<script src="assets/adaptive-ink.js"></script>
<script src="assets/font-catalog.js"></script>
<script src="assets/installed-apps.js"></script>
<script src="wallpaper-engine.js"></script>
<script src="main.js"></script>
</body>
</html>
